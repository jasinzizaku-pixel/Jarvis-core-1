<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090d18" />
  <meta name="description" content="JARVIS CORE – Dein persönliches KI-Betriebssystem." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <title>JARVIS CORE</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">J</div>
        <div><strong>JARVIS <span>CORE</span></strong><small>PERSONAL OPERATING SYSTEM</small></div>
      </div>
      <div class="workspace-label">WORKSPACE</div>
      <nav id="nav">
        <button class="nav-item active" data-view="overview"><span>◈</span> Übersicht</button>
        <button class="nav-item" data-view="chat"><span>◉</span> JARVIS Chat</button>
        <button class="nav-item" data-view="agents"><span>⬡</span> Agenten</button>
        <button class="nav-item" data-view="tasks"><span>✓</span> Aufgaben</button>
        <button class="nav-item" data-view="projects"><span>▦</span> Projekte</button>
        <button class="nav-item" data-view="research"><span>⌕</span> Research</button>
        <button class="nav-item" data-view="finance"><span>⌁</span> Finance</button>
        <button class="nav-item" data-view="assistant"><span>✧</span> Persönlicher Assistent</button>
        <button class="nav-item" data-view="approvals"><span>◷</span> Freigaben <b class="nav-count" id="approvalCount">0</b></button>
        <button class="nav-item" data-view="integrations"><span>⌘</span> Integrationen</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="local-status"><i></i><div><b>Lokaler MVP-Modus</b><small>Keine KI-Verbindung aktiv</small></div></div>
        <button class="nav-item" data-view="settings"><span>⚙</span> Einstellungen</button>
        <div class="user-chip"><div class="avatar">J</div><div><b>Dein Workspace</b><small>Persönlich · lokal</small></div></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Menü">☰</button>
        <div class="breadcrumb">JARVIS <span>/</span> <b id="crumb">Übersicht</b></div>
        <div class="top-actions"><span class="mode-pill"><i></i> DEMO / LOKAL</span><button class="icon-btn" id="quickAdd" title="Neue Aufgabe">＋</button></div>
      </header>
      <div class="content" id="content"></div>
      <footer>JARVIS CORE 1.0 <span>•</span> Lokaler Prototyp <span>•</span> Deine Daten bleiben in diesem Browser</footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="modal" class="modal"><form method="dialog"><button class="modal-close" aria-label="Schließen">×</button></form><div id="modalBody"></div></dialog>
  <script src="app.js"></script>
</body>
</html>
